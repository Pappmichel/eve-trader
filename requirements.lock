# Locked runtime + test dependencies for reproducible installs.
# Generated on Python 3.11 (CI also runs 3.10). Must also install on 3.12.
# Do not resolve these from pyproject.toml ranges in CI or production —
# install this file.
#
# itsdangerous is pinned to 2.2.0 (session-cookie signing / TimestampSigner
# API used by access_gate.read_session_token). A major bump needs an explicit
# review of URLSafeTimedSerializer.loads(..., return_timestamp=True).
#
# numpy<2.3, scipy<1.16, pandas<3, websockets<17: wheels above those bounds
# refuse Python 3.10 and/or 3.11 (P5-01). Regenerate on 3.11:
#   python3.11 -m venv /tmp/eve-lock && /tmp/eve-lock/bin/pip install -e ".[test]"
#   /tmp/eve-lock/bin/pip freeze | grep -v '^-e' > requirements.lock
# then re-run pip-audit and the test suite, and confirm a 3.10 venv can
# pip install -r requirements.lock. pip freeze on 3.11 omits exceptiongroup
# and tomli; keep their python_version < "3.11" marker pins.
#
# Install:
#   pip install -r requirements.lock
#   pip install -e . --no-deps

