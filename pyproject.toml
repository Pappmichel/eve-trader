[project]
name = "eve-trader"
version = "0.2.0rc1"
description = "C-J import trading and Tech I/II production planning toolkit for EVE Online"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pappmichel" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.0,<4",
    # Ore & Minerals' Mineral Shopping List (GitHub issue #93) solves a real
    # mixed-integer program (scipy.optimize.linprog/HiGHS, using the
    # `integrality` param added in scipy 1.9 - already covered by this pin)
    # for the cheapest whole-unit mix of ore-to-refine vs.
    # minerals-bought-outright - see eve_trader/refining/optimizer.py for why
    # a greedy ranking (or a relax-then-round LP) wasn't enough.
    "scipy>=1.11,<2",
    "PyYAML>=6.0,<7",
    "ruamel.yaml>=0.18,<0.20",
    "python-dotenv>=1.0,<2",
    "click>=8.1,<9",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # Session cookies (access_gate.py) use URLSafeTimedSerializer.loads
    # return_timestamp=True, present in 2.2. Pin exact — a major bump is a
    # session-security review, not a silent resolver move. Lockfile repeats
    # this pin; see docs/DEPENDENCY_SECURITY.md.
    "itsdangerous==2.2.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
eve-trader = "eve_trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eve_trader*"]

[tool.pytest.ini_options]
markers = [
    "release: Production Special-Order freeze regression (phases C–H)",
]
