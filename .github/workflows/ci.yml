name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    # Matches tests/pg_helpers.py's OWNER_DSN default exactly (postgres/
    # devpassword@localhost:5432/eve_trader) - the test suite's own
    # session-scoped autouse fixtures (_apply_phase1_schema etc.) apply
    # every schema file themselves the first time a Postgres-requiring test
    # module runs, so nothing beyond "a reachable, empty database with that
    # name" is needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: eve_trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the locked graph first so CI and production resolve the same
      # versions (including itsdangerous==2.2.0). Then the editable package
      # itself, without letting pip re-resolve pyproject ranges.
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.lock
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
