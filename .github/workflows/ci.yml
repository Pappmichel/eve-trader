name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Production runs Python 3.12 on aarch64, and native solver hangs have
      # shown up there but not on x86 (CLAUDE.md, HiGHS section). 3.11 stays
      # for local development.
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: ubuntu-24.04-arm, python-version: '3.12' }
    # Matches tests/pg_helpers.py's OWNER_DSN default exactly (postgres/
    # devpassword@localhost:5432). The tests never use the eve_trader
    # database itself: they create eve_trader_test (one per xdist worker,
    # eve_trader_test_gw0, ...) and their session fixtures apply every
    # schema file, so nothing beyond "a reachable server with that owner
    # role" is needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: eve_trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # F-06 (business-logic audit follow-up, 2026-09-26): SHA-pinned, not a
      # moving version tag - a compromised/re-tagged v7 release would
      # otherwise run in CI (with repo secrets in scope) without this
      # workflow file itself ever changing. Bump by re-pinning to a new
      # commit SHA, not by editing the trailing "# vN" comment alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # Install the locked graph first so CI and production resolve the same
      # versions (including itsdangerous==2.2.0). Then the editable package
      # itself, without letting pip re-resolve pyproject ranges.
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pip-audit
      # requirements.txt, not the lock file: the lock file is only a -r include,
      # which pip-audit would otherwise check as zero packages.
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -n auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'  # production's version; 20 is end-of-life
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # F-06 (business-logic audit follow-up, 2026-09-26): mirrors the
      # backend job's own pip-audit step - flags known-vulnerable dependency
      # versions in package-lock.json. `--omit dev` matches production's own
      # deploy.sh (`npm ci` for the built frontend, no dev-only tooling
      # shipped) - a vulnerable dev-only tool (a linter, a test runner) never
      # reaches a real user, so it doesn't need to fail this build the same
      # way a vulnerable shipped dependency would.
      - run: npm audit --omit dev
      # Dev tooling runs on developer machines and in deploy's build step, so a
      # finding there is reported too, without blocking on critical-only noise.
      - run: npm audit --audit-level=critical
      - run: npm run build
      - run: npm run lint
      - run: npm test
